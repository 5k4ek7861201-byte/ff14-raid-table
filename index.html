<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高難固定團：班表</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #1a1a1a; color: #eee; padding: 10px; margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 1400px; background: #262626; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); box-sizing: border-box; display: flex; flex-direction: column; align-items: center; }
        h1 { color: #4a90e2; text-align: center; margin-bottom: 20px; font-size: 1.5rem; }
        
        .setup-area { background: #333; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 5px solid #4a90e2; width: 100%; box-sizing: border-box; }
        .rule-text { margin-bottom: 8px; font-weight: bold; font-size: 0.9rem; }
        .warning-text { color: #ff4d4f; font-weight: bold; margin-top: 5px; font-size: 0.85rem; }
        .control-row { display: flex; align-items: flex-end; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        .input-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 120px; }
        .input-group label { font-size: 0.8em; color: #aaa; }
        
        .text-input, .strategy-input { padding: 8px; border-radius: 4px; border: 1px solid #555; background: #1a1a1a; color: white; width: 100%; box-sizing: border-box; }
        .strategy-input { color: #ff9f43; }
        
        .table-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; background: #222; min-width: 900px; }
        th, td { border: 1px solid #444; padding: 8px 4px; text-align: center; }
        th { background: #3d3d3d; color: #4a90e2; font-size: 0.9rem; }
        
        /* 固定左側日期欄位 */
        td:first-child, th:first-child { 
            position: sticky; left: 0; z-index: 2; background: #222; border-right: 2px solid #444; 
        }
        th:first-child { background: #3d3d3d; }

        .id-input, .job-select { width: 80px; padding: 5px; background: #1a1a1a; border: 1px solid #555; color: #fff; border-radius: 4px; margin-top: 5px; font-size: 12px; text-align: center; }
        .sub-input { width: 75px; font-size: 11px; padding: 3px; background: #333; border: 1px solid #555; color: #ff9f43; margin-top: 5px; border-radius: 2px; text-align: center; }
        
        input[type="checkbox"] { width: 24px; height: 24px; cursor: pointer; accent-color: #4a90e2; vertical-align: middle; }
        .count-num { font-weight: bold; color: #4a90e2; font-size: 1.2em; }
        .btn-update { background: #4a90e2; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }

        /* 狀態文字：手機版縮寫 */
        .status-text::after { content: " 人數不足"; }
        .status-ok .status-text::after { content: " 準時開打"; }

        @media (max-width: 600px) {
            .status-text::after { content: " 不足"; }
            .status-ok .status-text::after { content: " 準時"; }
        }

        @media (min-width: 768px) {
            .btn-update { width: auto; margin-top: 0; }
            .container { padding: 30px; }
            h1 { font-size: 2rem; }
        }

        .status-ok { color: #52c41a; font-weight: bold; background: rgba(82,196,26,0.15); padding: 5px 8px; border-radius: 4px; }
        .status-fail { color: #888; }
        .weekend { color: #ff9f43; }
    </style>
</head>
<body>

<div class="container">
    <h1>⚔️ 高難固定團：班表</h1>
    
    <div class="setup-area">
        <div class="rule-text">📌 規則：滿 6 人即開團</div>
        <div class="warning-text">⚠️ 請假請提早 2 天告知</div>
        
        <div class="control-row">
            <div class="input-group">
                <label>起始日期</label>
                <input type="text" id="startDatePicker" class="text-input" placeholder="YYYY/MM/DD" oninput="saveOtherInfo()">
            </div>
            <div class="input-group">
                <label>副本名稱</label>
                <input type="text" id="raidName" class="strategy-input" placeholder="副本名稱" oninput="saveOtherInfo()">
            </div>
            <div class="input-group">
                <label>打法備註</label>
                <input type="text" id="stratNote" class="strategy-input" placeholder="打法備註" oninput="saveOtherInfo()">
            </div>
            <button class="btn-update" onclick="confirmUpdate()">更新日期</button>
        </div>
    </div>

    <div class="table-wrapper">
        <table id="raidTable">
            <thead><tr id="roleHeader"></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const jobOptions = { 'Tank': ['騎士', '戰士', '黑騎', '絕槍'], 'Healer': ['白魔', '學者', '占星', '賢者'], 'DPS_Melee': ['武僧', '龍騎', '忍者', '武士', '奪魂', '毒蛇'], 'DPS_PhysRange': ['吟遊', '機工', '舞者'], 'DPS_Magic': ['黑魔', '召喚', '赤魔', '繪靈'] };
    const roles = [{label:'MT',type:'Tank'},{label:'ST',type:'Tank'},{label:'H1',type:'Healer'},{label:'H2',type:'Healer'},{label:'D1',type:'DPS_Melee'},{label:'D2',type:'DPS_Melee'},{label:'D3',type:'DPS_PhysRange'},{label:'D4',type:'DPS_Magic'}];

    function initHeader() {
        const roleHeader = document.getElementById('roleHeader');
        let headerHtml = `<th>日期</th>`;
        roles.forEach((r, idx) => {
            let options = jobOptions[r.type].map(j => `<option value="${j}">${j}</option>`).join('');
            headerHtml += `<th>${r.label}<br><select id="job-${idx}" class="job-select" onchange="saveMemberInfo()"><option value="">職業</option>${options}</select><br><input type="text" id="id-${idx}" class="id-input" placeholder="ID" oninput="saveMemberInfo()"></th>`;
        });
        headerHtml += `<th>人數</th><th class="status-cell">狀態</th>`;
        roleHeader.innerHTML = headerHtml;
    }

    function saveMemberInfo() {
        roles.forEach((r, idx) => {
            localStorage.setItem(`raid-job-${idx}`, document.getElementById(`job-${idx}`).value);
            localStorage.setItem(`raid-id-${idx}`, document.getElementById(`id-${idx}`).value);
        });
    }

    function saveOtherInfo() {
        localStorage.setItem(`raid-startDate`, document.getElementById('startDatePicker').value);
        localStorage.setItem(`raid-name`, document.getElementById('raidName').value);
        localStorage.setItem(`raid-strat`, document.getElementById('stratNote').value);
    }

    function saveTableState() {
        const states = [];
        for(let i=0; i<7; i++) {
            const rowData = [];
            roles.forEach((_, idx) => {
                const cb = document.getElementById(`cb-${i}-${idx}`);
                const sub = document.getElementById(`sub-${i}-${idx}`);
                rowData.push({ checked: cb.checked, note: sub.value });
            });
            states.push(rowData);
        }
        localStorage.setItem('raid-table-states', JSON.stringify(states));
    }

    function loadData() {
        roles.forEach((r, idx) => {
            document.getElementById(`job-${idx}`).value = localStorage.getItem(`raid-job-${idx}`) || "";
            document.getElementById(`id-${idx}`).value = localStorage.getItem(`raid-id-${idx}`) || "";
        });
        document.getElementById('startDatePicker').value = localStorage.getItem(`raid-startDate`) || "2026/03/28";
        document.getElementById('raidName').value = localStorage.getItem(`raid-name`) || "";
        document.getElementById('stratNote').value = localStorage.getItem(`raid-strat`) || "";
        generateTableContent(true);
    }

    function confirmUpdate() {
        if (confirm("⚠️ 確定要重置班表嗎？")) { 
            localStorage.removeItem('raid-table-states');
            generateTableContent(false); 
        }
    }
    
    function generateTableContent(shouldLoadStates) {
        const tableBody = document.getElementById('tableBody');
        const startVal = document.getElementById('startDatePicker').value;
        let startDate = new Date(startVal.replace(/\//g, '-'));
        if (isNaN(startDate.getTime())) return;

        let savedStates = [];
        if(shouldLoadStates) {
            const raw = localStorage.getItem('raid-table-states');
            if(raw) savedStates = JSON.parse(raw);
        }

        tableBody.innerHTML = "";
        for (let i = 0; i < 7; i++) {
            let current = new Date(startDate);
            current.setDate(startDate.getDate() + i);
            let dayNames = ['日', '一', '二', '三', '四', '五', '六'];
            let isWeekend = (current.getDay() === 0 || current.getDay() === 6);
            let row = document.createElement('tr');
            
            let cellsHtml = roles.map((r, idx) => {
                const state = (savedStates[i] && savedStates[i][idx]) ? savedStates[i][idx] : {checked: false, note: ""};
                return `<td>
                    <input type="checkbox" id="cb-${i}-${idx}" ${state.checked ? 'checked' : ''} onclick="handleUpdate(${i})"><br>
                    <input type="text" id="sub-${i}-${idx}" class="sub-input" value="${state.note}" placeholder="代班ID" oninput="handleUpdate(${i})">
                </td>`;
            }).join('');

            row.innerHTML = `<td class="${isWeekend ? 'weekend' : ''}" style="font-weight:bold; white-space:nowrap;">${current.getMonth() + 1}/${current.getDate()} (${dayNames[current.getDay()]})</td>
                ${cellsHtml}
                <td><span id="count-${i}" class="count-num">0</span></td>
                <td id="status-${i}" class="status-cell"></td>`;
            tableBody.appendChild(row);
            calculate(i);
        }
    }

    function handleUpdate(rowIndex) {
        calculate(rowIndex);
        saveTableState();
    }

    function calculate(rowIndex) {
        let count = 0;
        roles.forEach((_, idx) => {
            const isChecked = document.getElementById(`cb-${rowIndex}-${idx}`).checked;
            const hasSubstitute = document.getElementById(`sub-${rowIndex}-${idx}`).value.trim() !== "";
            if (isChecked || hasSubstitute) count++;
        });
        document.getElementById(`count-${rowIndex}`).innerText = count;
        const statusDisplay = document.getElementById(`status-${rowIndex}`);
        
        if (count >= 6) {
            statusDisplay.className = "status-cell status-ok";
            statusDisplay.innerHTML = `✅<span class="status-text"></span>`;
        } else {
            statusDisplay.className = "status-cell status-fail";
            statusDisplay.innerHTML = `❌<span class="status-text"></span>`;
        }
    }

    window.onload = function() { initHeader(); loadData(); };
</script>

</body>
</html>
